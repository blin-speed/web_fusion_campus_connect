spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/campus_circular?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  admin-password: ${ADMIN_PASSWORD:admin123}
  jwt-secret: ${JWT_SECRET:SuperSecretKeyForCampusCircularJWTThatIsLongEnough123!}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  llm-model: ${LLM_MODEL:claude-3-haiku-20240307}
